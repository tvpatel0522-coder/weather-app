<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Forecast</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #0d7c85;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #fff;
    }

    .container {
      text-align: center;
      max-width: 480px;
      width: 90%;
    }

    .header-title {
      font-size: 2.2rem;
      margin-bottom: 20px;
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .search-box input {
      flex: 1;
      padding: 12px 18px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    .search-box button {
      padding: 12px 24px;
      font-size: 1rem;
      background-color: #00b4d8;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .search-box button:hover {
      background-color: #0096c7;
    }

    .card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 16px;
      padding: 30px 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .error-msg {
      color: #ff6b6b;
      background: rgba(255, 107, 107, 0.2);
      border: 1px solid #ff6b6b;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-size: 0.95rem;
    }

    .weather-info {
      display: none;
    }

    .weather-info h2 {
      font-size: 1.8rem;
    }

    .temp {
      font-size: 3rem;
      font-weight: bold;
      margin: 10px 0;
    }

    .details {
      display: flex;
      justify-content: space-around;
      margin-top: 20px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="header-title">☀️ Weather Forecast</h1>
    
    <div class="search-box">
      <input type="text" id="cityInput" placeholder="Enter city name..." autocomplete="off" />
      <button onclick="getWeather()">Search</button>
    </div>

    <div class="card">
      <div id="welcomeBox">
        <h2>Welcome to Weather Forecast</h2>
        <p style="margin-top: 10px; font-size: 0.9rem;">Start by entering a city above.</p>
      </div>

      <div id="errorBox" class="error-msg"></div>

      <div id="weatherBox" class="weather-info">
        <h2 id="cityName">--</h2>
        <div class="temp" id="temp">--°C</div>
        <p id="weatherDesc">--</p>
        <div class="details">
          <p>💧 Humidity: <span id="humidity">--</span>%</p>
          <p>💨 Wind: <span id="wind">--</span> m/s</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ Replace with your actual OpenWeatherMap API key
    const apiKey = "YOUR_API_KEY"; 

    async function getWeather() {
      const cityInput = document.getElementById("cityInput");
      const city = cityInput.value.trim();

      const welcomeBox = document.getElementById("welcomeBox");
      const errorBox = document.getElementById("errorBox");
      const weatherBox = document.getElementById("weatherBox");

      errorBox.style.display = "none";

      if (city === "") {
        showError("Please enter a city name.");
        return;
      }

      const url = "https://api.openweathermap.org/data/2.5/weather?q=" + encodeURIComponent(city) + "&appid=" + apiKey + "&units=metric";

      try {
        const response = await fetch(url);

        if (!response.ok) {
          if (response.status === 404) {
            throw new Error("City not found. Please check the spelling.");
          } else {
            throw new Error("Something went wrong. Please check your API key.");
          }
        }

        const data = await response.json();

        welcomeBox.style.display = "none";
        weatherBox.style.display = "block";

        document.getElementById("cityName").innerText = data.name + ", " + data.sys.country;
        document.getElementById("temp").innerText = Math.round(data.main.temp) + "°C";
        document.getElementById("weatherDesc").innerText = data.weather[0].description;
        document.getElementById("humidity").innerText = data.main.humidity;
        document.getElementById("wind").innerText = data.wind.speed;

      } catch (error) {
        welcomeBox.style.display = "none";
        weatherBox.style.display = "none";
        showError(error.message);
      }
    }

    function showError(message) {
      const errorBox = document.getElementById("errorBox");
      errorBox.innerText = message;
      errorBox.style.display = "block";
    }

    document.getElementById("cityInput").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        getWeather();
      }
    });
  </script>
</body>
</html>
